name: wealth_desk
description: Wealth Desk — Android app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.0
  google_mobile_ads: ^5.2.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^17.2.0
  workmanager: ^0.5.2
  http: ^1.2.0
  printing: ^5.13.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FAE80A"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#F1F0E8"
  image: assets/splash.png
  android_12:
    color: "#F1F0E8"
    image: assets/splash_android12.png
  ios: false
  web: false
